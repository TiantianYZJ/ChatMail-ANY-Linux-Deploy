# =============================================================================
# ChatMail proxy rules — include this in your host nginx config
#
# USAGE:
#   1. This file contains `location` blocks that must be pasted INSIDE your
#      existing site's `server { }` block for <domain>, AND
#   2. a `server { }` block for autoconfig.<domain> that must go at the TOP
#      level of nginx.conf (or in a conf.d include).
#
# Two file formats / two hosts must work for Delta Chat's autoconfig:
#   A) https://autoconfig.<domain>/config-v1.1.xml   ← core prefers this
#   B) https://<domain>/.well-known/autoconfig/mail/config-v1.1.xml
#
# The XML files are generated by genconfig.py into /var/www/html/... — they
# are plain static files, served directly by the HOST nginx (no container
# round-trip needed).
# =============================================================================

# ---------------------------------------------------------------------------
# PART 1 — location blocks for your existing <domain> site (paste into its
#          `server { }` block, e.g. BT-Panel 网站 → 设置 → 配置文件)
# ---------------------------------------------------------------------------

# /new — account creation (CGI proxied to container fcgiwrap)
location /new {
    proxy_pass http://127.0.0.1:10234;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location /cgi-bin/ {
    proxy_pass http://127.0.0.1:10234;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

# iroh-relay (Delta Chat realtime push)
location /relay {
    proxy_pass http://127.0.0.1:3340;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}
location /ping {
    proxy_pass http://127.0.0.1:3340;
    proxy_http_version 1.1;
}
location /generate_204 {
    proxy_pass http://127.0.0.1:3340;
    proxy_http_version 1.1;
}

# ACME challenge — served from the web root
location /.well-known/acme-challenge/ {
    root /var/www/html;
}

# Autoconfig (RFC 6186) — the XML is a static file generated into /var/www/html
# Serve it directly; do NOT proxy to the container.
location /.well-known/autoconfig/ {
    root /var/www/html;
}

# MTA-STS policy — static file generated into /var/www/html
location /.well-known/mta-sts.txt {
    root /var/www/html;
}

# ---------------------------------------------------------------------------
# PART 2 — server block for autoconfig.<domain> (paste at nginx TOP LEVEL,
#          NOT inside an existing server block)
#
#   server_name autoconfig.your-domain.com;
#   Also add a DNS A record:  autoconfig  A  <server-ip>
# ---------------------------------------------------------------------------

